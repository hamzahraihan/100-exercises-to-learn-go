<button id="book-theme-toggle" class="book-theme-toggle" type="button" aria-pressed="false" aria-label="Toggle dark mode">
  <svg id="book-theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg id="book-theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <span id="book-theme-label">Dark mode</span>
</button>
<script>
(function () {
  var root = document.documentElement;
  var btn = document.getElementById("book-theme-toggle");
  var moon = document.getElementById("book-theme-icon-moon");
  var sun = document.getElementById("book-theme-icon-sun");
  var label = document.getElementById("book-theme-label");
  if (!btn) return;
  function render(theme) {
    var dark = theme === "dark";
    moon.hidden = dark;
    sun.hidden = !dark;
    label.textContent = dark ? "Light mode" : "Dark mode";
    btn.setAttribute("aria-pressed", dark ? "true" : "false");
  }
  render(root.getAttribute("data-theme") || "light");
  btn.addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("book-theme", next); } catch (e) {}
    render(next);
  });
})();
</script>
