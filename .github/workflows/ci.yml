name: ci
on:
  push:
    branches: [main, solutions]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
      - name: Formatting is clean (except the intentionally unformatted tooling stub)
        run: test -z "$(gofmt -l . | grep -v '^exercises/01_intro/04_tooling/tooling.go$')"
      - run: go build ./...
      - run: go test ./...
        if: github.ref == 'refs/heads/solutions'
